name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0). Leave empty to build current commit and upload workflow artifacts only."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Sign, notarize, publish macOS DMG
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for Next + electron-builder)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect credentials
        id: creds
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          fail=0
          method=""

          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::Missing secret APPLE_CERTIFICATE (base64 of Developer ID Application .p12). See build/macos-signing.md"
            fail=1
          fi
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Missing secret APPLE_TEAM_ID"
            fail=1
          fi

          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            method="api"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            method="apple-id"
          else
            echo "::error::Provide either APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER (preferred), or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD"
            fail=1
          fi

          {
            echo "method=$method"
            echo "has_certificate=$([ -n "$APPLE_CERTIFICATE" ] && echo true || echo false)"
            echo "has_team_id=$([ -n "$APPLE_TEAM_ID" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          exit $fail

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"

          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Missing secret APPLE_CERTIFICATE_PASSWORD (password for the .p12)"
            exit 1
          fi

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Put our keychain first without dropping the system keychains.
          EXISTING=$(security list-keychain -d user | tr -d '"')
          security list-keychain -d user -s "$KEYCHAIN_PATH" $EXISTING
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Identities available for codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Export notarization environment
        if: steps.creds.outputs.method == 'api'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          # Accept raw PEM or base64-encoded PEM
          if printf '%s' "$APPLE_API_KEY_P8" | head -n1 | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          {
            echo "APPLE_API_KEY=$KEY_PATH"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          # Prefer API-key notarization; clear Apple ID so electron-builder
          # does not try both paths.
          {
            echo "APPLE_ID="
            echo "APPLE_APP_SPECIFIC_PASSWORD="
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize (universal DMG)
        env:
          APPLE_ID: ${{ steps.creds.outputs.method == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.creds.outputs.method == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Fail rather than silently shipping an unsigned build
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run dist:mac

      - name: Verify Gatekeeper acceptance
        run: |
          APP_PATH=$(find dist -maxdepth 3 -type d -name "StoreShot.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::StoreShot.app not found under dist/"
            ls -la dist || true
            exit 1
          fi

          echo "=== codesign verify ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "=== codesign details ==="
          codesign -dvv "$APP_PATH"
          echo "=== spctl (Gatekeeper) ==="
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          echo "=== stapler ==="
          xcrun stapler validate "$APP_PATH"
          echo "=== artifacts ==="
          ls -lh dist/*.dmg || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storeshot-mac-dmg
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml
