<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StoreShot — README</title>
  <meta name="description" content="StoreShot README mirrored from GitHub." />
  <link rel="canonical" href="https://stackwares.github.io/storeshot-electron/" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --canvas: #f6f8fa;
      --link: #0969da;
      --code-bg: #f6f8fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --border: #30363d;
        --canvas: #161b22;
        --link: #4493f8;
        --code-bg: #161b22;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 16px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--bg);
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.65rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
    }
    .topbar a {
      color: var(--fg);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .topbar a:hover { color: var(--link); }
    .topbar .muted { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
    main {
      width: min(980px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }
    .status {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .status a { color: var(--link); }
    .markdown-body img { max-width: 100%; height: auto; border-radius: 6px; }
    .markdown-body h1, .markdown-body h2 {
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
      line-height: 1.25;
    }
    .markdown-body h3 { line-height: 1.25; margin-top: 1.5em; }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin: 0 0 1rem; }
    .markdown-body li + li { margin-top: 0.25em; }
    .markdown-body a { color: var(--link); }
    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 85%;
      background: var(--code-bg);
      border-radius: 6px;
      padding: 0.15em 0.4em;
    }
    .markdown-body pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
    }
    .markdown-body pre code {
      background: transparent;
      padding: 0;
      font-size: 85%;
    }
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 0 0 1rem;
      display: block;
      overflow-x: auto;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.75rem;
    }
    .markdown-body th { background: var(--canvas); }
    .markdown-body blockquote {
      margin: 0 0 1rem;
      padding: 0 1em;
      color: var(--muted);
      border-left: 0.25em solid var(--border);
    }
    .error { color: #d1242f; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="https://github.com/stackwares/storeshot-electron">stackwares/storeshot-electron</a>
    <a class="muted" href="https://github.com/stackwares/storeshot-electron#readme">View on GitHub</a>
  </header>
  <main>
    <p class="status" id="status">Loading README…</p>
    <article class="markdown-body" id="readme" aria-live="polite"></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    (function () {
      var owner = "stackwares";
      var repo = "storeshot-electron";
      var branch = "main";
      var readmeUrl = "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" + branch + "/README.md";
      var blobBase = "https://github.com/" + owner + "/" + repo + "/blob/" + branch + "/";
      var rawBase = "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" + branch + "/";
      var statusEl = document.getElementById("status");
      var root = document.getElementById("readme");

      function absolutize(md) {
        return md
          .replace(/!\[([^\]]*)\]\((?!https?:|data:)([^)\s]+)\)/g, function (_, alt, path) {
            return "![" + alt + "](" + rawBase + path.replace(/^\.\//, "") + ")";
          })
          .replace(/\[([^\]]+)\]\((?!https?:|mailto:|#)([^)\s]+)\)/g, function (_, text, path) {
            if (/^public\//.test(path) || /\.(png|jpe?g|gif|webp|svg)$/i.test(path)) {
              return "[" + text + "](" + rawBase + path.replace(/^\.\//, "") + ")";
            }
            return "[" + text + "](" + blobBase + path.replace(/^\.\//, "") + ")";
          });
      }

      fetch(readmeUrl, { cache: "no-cache" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (md) {
          root.innerHTML = marked.parse(absolutize(md));
          root.querySelectorAll("a").forEach(function (a) {
            a.setAttribute("target", "_blank");
            a.setAttribute("rel", "noopener noreferrer");
          });
          statusEl.innerHTML =
            'Live mirror of <a href="https://github.com/' + owner + "/" + repo + '/blob/' + branch + '/README.md">README.md</a> on <code>' + branch + "</code>.";
        })
        .catch(function (err) {
          statusEl.innerHTML =
            'Could not load README (' + err.message + "). " +
            '<a href="https://github.com/' + owner + "/" + repo + "#readme\">Open it on GitHub</a>.';
        });
    })();
  </script>
</body>
</html>
